<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda tu Clase de Salsa</title>

<style>
:root{
  --rojo:#e50914;
  --negro:#0f0f0f;
  --gris:#1c1c1c;
  --verde:#1db954;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--negro);
  color:white;
}

/* HEADER */
header{
  text-align:center;
  padding:15px;
  background:black;
  font-weight:bold;
}

/* HERO */
.hero{
  text-align:center;
  padding:50px 20px;
}

.hero h1{
  color:var(--rojo);
  font-size:2em;
}

/* CONTENEDOR */
.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

/* TARJETA */
.card{
  background:var(--gris);
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

/* INPUTS */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:6px;
}

/* BOTÓN */
.btn{
  width:100%;
  background:var(--rojo);
  border:none;
  padding:15px;
  color:white;
  font-size:16px;
  cursor:pointer;
  border-radius:6px;
  transition:0.3s;
}

.btn:hover{
  background:#b20710;
}

/* HORARIOS */
#horarios{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
}

#horarios button{
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  color:white;
}

.disponible{
  background:var(--verde);
}

.ocupado{
  background:#444;
  pointer-events:none;
}

.selected{
  outline:2px solid white;
}

/* MENSAJES */
#mensaje{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}

/* LOADER */
.loader{
  display:none;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<header>🔥 Salsa con Roberto</header>

<section class="hero">
  <h1>Reserva tu clase</h1>
  <p>Martes y Jueves • 8pm y 9pm</p>
</section>

<div class="container">

<div class="card">
  <h3>📅 Selecciona tu horario</h3>
  <input type="date" id="fecha">
  <div id="horarios"></div>
</div>

<div class="card">
  <form id="form">
    <input type="text" name="nombre" placeholder="Nombre completo" required>
    <input type="tel" name="telefono" placeholder="WhatsApp (10 dígitos)" required>

    <button class="btn">🔥 Confirmar Reserva</button>
  </form>

  <div class="loader" id="loader">⏳ Procesando...</div>
  <p id="mensaje"></p>
</div>

</div>

<script>

const WEBHOOK = "https://villa84.app.n8n.cloud/webhook/alumnos";
const HORAS = ["20:00","21:00"];

let horaSeleccionada = "";

// render horarios
function renderHorarios(ocupados=[]){
  const cont = document.getElementById("horarios");
  cont.innerHTML="";

  HORAS.forEach(h=>{
    const btn = document.createElement("button");
    btn.innerText = h;

    if(ocupados.includes(h)){
      btn.className = "ocupado";
    }else{
      btn.className = "disponible";

      btn.onclick=()=>{
        horaSeleccionada = h;

        document.querySelectorAll("#horarios button")
        .forEach(b=>b.classList.remove("selected"));

        btn.classList.add("selected");
      }
    }

    cont.appendChild(btn);
  });
}

// cargar disponibilidad
async function cargarDisponibilidad(){
  const fecha = document.getElementById("fecha").value;
  if(!fecha) return;

  try{
    const res = await fetch(`${WEBHOOK}?fecha=${fecha}`);
    const data = await res.json();

    renderHorarios(data.ocupados || []);

  }catch{
    renderHorarios();
  }
}

document.getElementById("fecha")
.addEventListener("change", cargarDisponibilidad);

// enviar formulario
document.getElementById("form")
.addEventListener("submit", async(e)=>{
  e.preventDefault();

  const mensaje = document.getElementById("mensaje");
  const loader = document.getElementById("loader");

  mensaje.innerText = "";

  if(!horaSeleccionada){
    mensaje.innerText = "⚠️ Selecciona un horario";
    return;
  }

  const form = Object.fromEntries(new FormData(e.target));
  const fecha = document.getElementById("fecha").value;

  // validación teléfono
  if(form.telefono.length < 10){
    mensaje.innerText = "⚠️ Número inválido";
    return;
  }

  const data = {
    ...form,
    fecha,
    hora: horaSeleccionada
  };

  loader.style.display="block";

  try{
    const res = await fetch(WEBHOOK,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });

    if(!res.ok) throw new Error();

    loader.style.display="none";

    mensaje.innerText = "🔥 Reserva confirmada";

    // abrir WhatsApp automático
    const texto = `Hola, soy ${form.nombre} y agendé clase el ${fecha} a las ${horaSeleccionada}`;
    window.open(`https://wa.me/52${form.telefono}?text=${encodeURIComponent(texto)}`);

    e.target.reset();
    renderHorarios();

  }catch{
    loader.style.display="none";
    mensaje.innerText = "❌ Error al agendar, intenta nuevamente";
  }

});

// inicial
renderHorarios();

</script>

</body>
</html>
