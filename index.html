<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda tu Clase de Salsa</title>

<style>
:root{
  --rojo:#e50914;
  --negro:#0f0f0f;
  --azul:#1e90ff;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--negro);
  color:white;
}

header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:black;
}

nav a{
  color:white;
  margin:10px;
  text-decoration:none;
}

.hero{
  text-align:center;
  padding:50px 20px;
}

.btn{
  background:var(--rojo);
  border:none;
  padding:12px 20px;
  color:white;
  cursor:pointer;
}

.section{
  padding:40px 20px;
}

.card{
  background:#1c1c1c;
  padding:20px;
  margin:10px;
  border-radius:10px;
}

input, select{
  width:100%;
  padding:10px;
  margin:10px 0;
}

#horarios button{
  margin:5px;
  padding:10px;
  cursor:pointer;
}

.ocupado{
  background:red;
  pointer-events:none;
}

.disponible{
  background:green;
}
</style>
</head>

<body>

<header>
  <h2>🔥 Salsa con Roberto</h2>
</header>

<section class="hero">
  <h1>Reserva tu clase ahora</h1>
  <p>Clases martes y jueves</p>
</section>

<section class="section">

<h2>📅 Selecciona tu horario</h2>

<input type="date" id="fecha">

<div id="horarios"></div>

<form id="form">
  <input type="text" name="nombre" placeholder="Nombre" required>
  <input type="tel" name="telefono" placeholder="WhatsApp" required>

  <input type="hidden" name="fecha">
  <input type="hidden" name="hora">

  <button class="btn">🔥 Confirmar Reserva</button>
</form>

<p id="mensaje"></p>

</section>

<script>

// 🔥 TU WEBHOOK
const WEBHOOK = "https://villa84.app.n8n.cloud/webhook/alumnos";

// horarios base
const HORAS = ["20:00","21:00"];

let horaSeleccionada = "";

// generar botones
function renderHorarios(ocupados=[]){
  const cont = document.getElementById("horarios");
  cont.innerHTML="";

  HORAS.forEach(h=>{
    const btn = document.createElement("button");
    btn.innerText = h;

    if(ocupados.includes(h)){
      btn.classList.add("ocupado");
    }else{
      btn.classList.add("disponible");
      btn.onclick=()=>{
        horaSeleccionada = h;
        alert("Seleccionaste: "+h);
      }
    }

    cont.appendChild(btn);
  });
}

// consultar disponibilidad en n8n
async function cargarDisponibilidad(){
  const fecha = document.getElementById("fecha").value;

  if(!fecha) return;

  try{
    const res = await fetch(WEBHOOK + "?fecha=" + fecha);
    const data = await res.json();

    // esperamos algo así: ["20:00"]
    renderHorarios(data.ocupados || []);

  }catch{
    renderHorarios(); // fallback
  }
}

document.getElementById("fecha").addEventListener("change", cargarDisponibilidad);

// enviar formulario
document.getElementById("form").addEventListener("submit", async(e)=>{
  e.preventDefault();

  if(!horaSeleccionada){
    alert("Selecciona un horario");
    return;
  }

  const fecha = document.getElementById("fecha").value;

  const formData = Object.fromEntries(new FormData(e.target));

  formData.fecha = fecha;
  formData.hora = horaSeleccionada;

  try{
    await fetch(WEBHOOK,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(formData)
    });

    document.getElementById("mensaje").innerText =
    "🔥 Clase agendada correctamente";

    e.target.reset();

  }catch{
    alert("Error al agendar");
  }

});

// inicial
renderHorarios();

</script>

</body>
</html>
