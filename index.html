<!DOCTYPE html>
<html>
<head>
  <title>CRM Salsa - Magic Flow</title>
  <style>
    body { font-family: Arial; background: #111; color: white; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border: 1px solid #444; }
    th { background: red; }
    tr:hover { background: #222; }
  </style>
</head>

<body>

<h1>💃 CRM Alumnos Salsa - Magic Flow</h1>

<table id="tabla">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Teléfono</th>
      <th>Nivel</th>
      <th>Pago</th>
      <th>Asistencia</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
fetch(https://villa84.app.n8n.cloud/webhook/obtener-alumnos)
.then(res => res.json())
.then(data => {
  const tabla = document.querySelector("#tabla tbody");

  data.forEach(alumno => {
    const fila = `
      <tr>
        <td>${alumno.Nombre}</td>
        <td>${alumno.Teléfono}</td>
        <td>${alumno.Nivel}</td>
        <td>${alumno.Estado_Pago}</td>
        <td>${alumno.Asistencia}</td>
      </tr>
    `;
    tabla.innerHTML += fila;
  });
});
</script>

</body>
</html>
